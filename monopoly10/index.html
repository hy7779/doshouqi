<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1310">
<title>大富翁10 · 2.5D 原型</title>
<style>
  :root { --gold: #d9b26a; --ink: #ece4d4; --dim: #9aa8a0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0a1310; color: var(--ink);
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: fixed; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .top { top: 14px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .panel { background: #0e1a16dd; border: 1px solid #2c4038; border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(6px); }
  .turn { font-size: 15px; letter-spacing: .06em; }
  .sub { font-size: 11px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 8px; }

  button { font: inherit; color: var(--ink); background: #17251f; border: 1px solid #2c4038;
    border-radius: 10px; padding: 8px 14px; cursor: pointer; transition: .15s; }
  button:hover { border-color: #4a6a5c; }
  button.primary { background: linear-gradient(180deg, #d9b26a, #b8904c); color: #221a0d; border-color: #e5c98f; font-weight: 600; }

  .right { top: 84px; right: 14px; width: 210px; display: grid; gap: 10px; }
  .pl { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 8px; font-size: 12px; }
  .pl.on { background: #1d2f27; box-shadow: inset 0 0 0 1px #d9b26a55; }
  .pl.out { opacity: .4; }
  .pl .dot { width: 8px; height: 8px; border-radius: 50%; }
  .pl .nm { flex: 1; }
  .pl .money { font-variant-numeric: tabular-nums; color: #cfc4ad; }

  .bottom { left: 14px; right: 14px; bottom: 14px; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .dice { font-variant-numeric: tabular-nums; font-size: 18px; min-width: 84px; text-align: center; letter-spacing: .08em; }

  .hand { display: flex; gap: 6px; flex-wrap: wrap; max-width: 460px; }
  .card { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #2a2350; border: 1px solid #4a3f8a; color: var(--ink); cursor: pointer; }
  .card:hover { border-color: #9a86e0; }
  .empty { font-size: 11px; color: var(--dim); }
  .pl.targetable { cursor: pointer; box-shadow: inset 0 0 0 1px #4a9de0aa; }
  .hint { position: fixed; left: 50%; top: 86px; transform: translateX(-50%);
    background: #1d2f27; border: 1px solid #3b5546; padding: 6px 14px; border-radius: 999px;
    font-size: 12px; opacity: 0; transition: .2s; pointer-events: none; }
  .hint.on { opacity: 1; }

  #setup { position: fixed; inset: 0; background: #08120fe0; backdrop-filter: blur(5px);
    display: grid; place-items: center; z-index: 150; }
  #setup[hidden] { display: none; }
  .setup-box { width: min(440px, 92vw); display: grid; gap: 14px; padding: 18px; }
  .setup-box h2 { margin: 0; font-size: 16px; letter-spacing: .1em; }
  .setup-box .row { display: flex; align-items: center; gap: 12px; }
  .setup-box .row > span { width: 34px; color: var(--dim); font-size: 12px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .opts button { padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: #17251f; font-size: 12px; }
  .opts button.on { border-color: var(--gold); color: var(--gold); }
  #setup button.primary { padding: 10px; border-radius: 10px; font-weight: 600; }
  .setup-box input { background: #0e1a16; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; width: 150px; }
  #roombar { position: fixed; left: 14px; top: 92px; z-index: 90; font-size: 12px; }
  #roombar b { color: var(--gold); letter-spacing: .2em; margin: 0 4px; }
  .waiting { color: var(--dim); font-size: 13px; padding: 8px 4px; }

  #rotate { position: fixed; inset: 0; background: #08120f; z-index: 200; display: none;    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: var(--ink); font-size: 15px; letter-spacing: .1em; }
  #rotate .rot-icon { font-size: 42px; transform: rotate(90deg); }
  @media (orientation: portrait) and (max-width: 820px) {
    #rotate { display: flex; }
  }

  #log { max-height: 120px; overflow: auto; font-size: 11px; color: #b9c4bc; line-height: 1.5; }
  #log div { border-bottom: 1px dashed #22332c; padding: 2px 0; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(8px);
    background: #20342b; border: 1px solid #3b5546; padding: 8px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .right { display: none; }
    .bottom { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<canvas id="board"></canvas>

<div class="hud top">
  <div class="panel">
    <div class="turn" id="turn">—</div>
    <div class="sub" id="cash">—</div>
    <div class="sub" id="round">—</div>
  </div>
  <div class="tools">
    <button id="follow">🔒 跟随</button>
    <button id="newgame">新开一局</button>
  </div>
</div>

<div class="hud right">
  <div class="panel">
    <div id="players"></div>
  </div>
  <div class="panel">
    <div id="log"></div>
  </div>
</div>

<div class="hud bottom">
  <div class="panel" style="display:grid;gap:8px">
    <div class="actions" id="actions"></div>
    <div class="hand" id="hand"></div>
  </div>
  <div class="panel dice" id="dice">—</div>
</div>

<div class="hint" id="hint"></div>

<div id="setup">
  <div class="panel setup-box">
    <h2>开一局</h2>
    <div class="row"><span>模式</span><div class="opts" id="modeOpts">
      <button data-mode="solo" class="on">单机</button>
      <button data-mode="host">开房</button>
      <button data-mode="join">加入</button>
    </div></div>
    <div class="row"><span>地图</span><div class="opts" id="mapOpts">
      <button data-map="small" class="on">小 50 格</button>
      <button data-map="medium">中 90 格</button>
      <button data-map="large">大 150 格</button>
    </div></div>
    <div class="row"><span>人数</span><div class="opts" id="countOpts">
      <button data-n="2">2</button><button data-n="3">3</button>
      <button data-n="4" class="on">4</button><button data-n="5">5</button>
      <button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button>
    </div></div>
    <div class="row"><span>名字</span><input id="nameInput" maxlength="6" value="玩家" /></div>
    <div class="row" id="codeRow" hidden><span>房间号</span><input id="codeInput" maxlength="6" placeholder="六位，如 AB12CD" /></div>
    <button class="primary" id="startBtn" style="margin-top:6px">开始游戏</button>
  </div>
</div>

<div class="panel" id="roombar" hidden>
  房间号 <b id="roomCode">—</b> · <span id="roomStatus">等待玩家</span>
</div>

<div id="rotate">
  <div class="rot-icon">📱</div>
  <div>请把手机横过来</div>
</div>
<div class="toast" id="toast"></div>

<script>
  // 原型阶段：旧版 Service Worker 会把上一版的 app.mjs 缓存住，导致“按钮点不动”。
  // 第一次打开时注销它并自动刷新一次，之后不再打扰。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      var seen = localStorage.getItem('mono10-sw-cleared');
      if (list.length && !seen) {
        localStorage.setItem('mono10-sw-cleared', '1');
        Promise.all(list.map(function (r) { return r.unregister(); })).then(function () {
          location.reload();
        });
      }
    }).catch(function () {});
  }
</script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="module" src="./render/app.mjs?v=3"></script>
</body>
</html>
